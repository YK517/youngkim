<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Young Jin Kim - Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #060810;
            --bg2: #0d1120;
            --surface: rgba(255,255,255,0.04);
            --border: rgba(255,255,255,0.08);
            --accent: #4af0c4;
            --accent2: #5b8dff;
            --text: #eef0f6;
            --muted: #7a8099;
            --font-display: 'Syne', sans-serif;
            --font-body: 'DM Sans', sans-serif;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: var(--font-body);
            background: var(--bg);
            color: var(--text);
            line-height: 1.65;
            overflow-x: hidden;
        }

        #bg-canvas {
            position: fixed; inset: 0; z-index: 0;
            pointer-events: none; opacity: 0.18;
        }

        nav {
            position: fixed; top: 0; width: 100%; z-index: 100;
            padding: 1.2rem 6%;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(6, 8, 16, 0.85);
            backdrop-filter: blur(18px);
            border-bottom: 1px solid var(--border);
        }

        .nav-logo {
            font-family: var(--font-display);
            font-weight: 800; font-size: 1.2rem;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            letter-spacing: -0.02em;
        }

        nav ul { list-style: none; display: flex; gap: 2.5rem; }

        nav a {
            font-family: var(--font-display);
            color: var(--muted); text-decoration: none;
            font-size: 0.85rem; font-weight: 600; letter-spacing: 0.08em;
            text-transform: uppercase; transition: color 0.25s;
            position: relative;
        }
        nav a::after {
            content: ''; position: absolute; bottom: -4px; left: 0;
            width: 0; height: 2px;
            background: var(--accent); transition: width 0.3s;
        }
        nav a:hover { color: var(--accent); }
        nav a:hover::after { width: 100%; }

        section {
            position: relative; z-index: 1;
            padding: 3rem 6%;
            max-width: 1200px; margin: 0 auto;
        }

        #home {
            min-height: 60vh;
            display: flex; align-items: center; justify-content: center;
            padding-top: 5rem; padding-bottom: 1rem; text-align: center;
        }

        .hero-inner {
            display: flex; flex-direction: column;
            align-items: center; gap: 0.9rem;
            width: 100%; max-width: 700px;
        }

        .hero-tag {
            display: inline-block;
            font-family: var(--font-display);
            font-size: 0.75rem; font-weight: 600;
            letter-spacing: 0.15em; text-transform: uppercase;
            color: var(--accent);
            border: 1px solid rgba(74,240,196,0.3);
            padding: 0.35rem 0.9rem; border-radius: 50px;
            animation: fadeUp 0.8s ease both;
        }

        .hero-name {
            font-family: var(--font-display);
            font-size: clamp(2.4rem, 5vw, 3.8rem);
            font-weight: 800;
            line-height: 1.05;
            letter-spacing: -0.03em;
            animation: fadeUp 0.8s ease 0.1s both;
        }

        .hero-name span {
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .hero-subtitle {
            font-size: 1.05rem; color: var(--muted);
            animation: fadeUp 0.8s ease 0.2s both;
        }

        .hero-profile-row {
            display: flex; justify-content: center;
            flex-direction: column; align-items: center;
            gap: 0.6rem;
            animation: fadeUp 0.8s ease 0.3s both;
        }
        .hero-profile-chip {
            display: flex; align-items: center; gap: 0.5rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 50px; padding: 0.55rem 1.4rem;
            font-family: var(--font-display);
            font-size: 0.82rem; font-weight: 600;
            color: var(--muted); white-space: nowrap;
        }
        .hero-profile-chip span { color: var(--accent); }

        .btn-primary {
            padding: 0.85rem 2rem;
            background: var(--accent); color: var(--bg);
            border-radius: 50px; text-decoration: none;
            font-family: var(--font-display);
            font-weight: 700; font-size: 0.9rem;
            transition: all 0.3s;
            border: none; cursor: pointer;
        }
        .btn-primary:hover {
            background: #2dd9ac;
            transform: translateY(-3px);
            box-shadow: 0 12px 32px rgba(74,240,196,0.35);
        }

        .badge {
            display: inline-block; padding: 0.2rem 0.6rem;
            border-radius: 50px; font-size: 0.75rem;
            font-family: var(--font-display); font-weight: 600;
        }
        .badge-green { background: rgba(74,240,196,0.15); color: var(--accent); }
        .badge-blue  { background: rgba(91,141,255,0.15); color: var(--accent2); }

        .section-label {
            font-family: var(--font-display);
            font-size: 0.75rem; font-weight: 600;
            letter-spacing: 0.15em; text-transform: uppercase;
            color: var(--accent); margin-bottom: 0.75rem;
        }

        .section-title {
            font-family: var(--font-display);
            font-size: clamp(1.8rem, 3vw, 2.6rem);
            font-weight: 800; letter-spacing: -0.02em;
            margin-bottom: 1rem;
        }

        .section-desc { color: var(--muted); max-width: 520px; margin-bottom: 2rem; }

        .timeline { position: relative; padding-left: 2rem; }
        .timeline::before {
            content: ''; position: absolute; left: 0; top: 0.5rem; bottom: 0;
            width: 2px; background: var(--border);
        }

        .tl-item {
            position: relative; margin-bottom: 2rem;
            padding-left: 1.5rem;
        }
        .tl-item::before {
            content: ''; position: absolute; left: -2.4rem; top: 0.4rem;
            width: 12px; height: 12px; border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 0 4px rgba(74,240,196,0.15);
        }

        .tl-meta {
            display: flex; gap: 1rem; align-items: center;
            margin-bottom: 0.4rem; flex-wrap: wrap;
        }
        .tl-date {
            font-family: var(--font-display);
            font-size: 0.78rem; font-weight: 600;
            color: var(--muted); letter-spacing: 0.05em;
        }
        .tl-company {
            font-family: var(--font-display);
            font-size: 0.78rem; font-weight: 700;
            color: var(--accent2);
        }
        .tl-title {
            font-family: var(--font-display);
            font-size: 1.15rem; font-weight: 700;
            margin-bottom: 0.75rem;
        }
        .tl-points { list-style: none; }
        .tl-points li {
            color: var(--muted); font-size: 0.9rem;
            padding: 0.3rem 0 0.3rem 1.2rem;
            position: relative;
        }
        .tl-points li::before {
            content: '›'; position: absolute; left: 0;
            color: var(--accent); font-weight: 700;
        }

        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 0.9rem;
        }

        .skill-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px; padding: 1.2rem 1.4rem;
            transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
            position: relative; overflow: hidden;
        }
        .skill-card::before {
            content: '';
            position: absolute; inset: 0;
            background: linear-gradient(135deg, rgba(74,240,196,0.06) 0%, rgba(91,141,255,0.06) 100%);
            opacity: 0; transition: opacity 0.35s;
        }
        .skill-card:hover::before { opacity: 1; }
        .skill-card:hover {
            border-color: rgba(74,240,196,0.5);
            transform: translateY(-6px) scale(1.01);
            box-shadow: 0 20px 48px rgba(74,240,196,0.13);
        }

        .skill-icon {
            font-size: 1.5rem; margin-bottom: 0.5rem;
            display: block;
            filter: drop-shadow(0 0 8px rgba(74,240,196,0.3));
        }

        .skill-card h4 {
            font-family: var(--font-display);
            font-weight: 700; font-size: 0.9rem;
            margin-bottom: 0.6rem; color: var(--text);
            letter-spacing: -0.01em;
        }

        .skill-tags { display: flex; flex-wrap: wrap; gap: 0.4rem; }
        .skill-tag {
            padding: 0.25rem 0.65rem; border-radius: 50px;
            font-size: 0.72rem; font-family: var(--font-display); font-weight: 600;
            background: rgba(74,240,196,0.08); color: var(--accent);
            border: 1px solid rgba(74,240,196,0.2);
            transition: all 0.2s;
        }
        .skill-tag:hover {
            background: rgba(74,240,196,0.18);
            border-color: var(--accent);
        }

        .edu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .edu-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px; padding: 2rem;
            transition: all 0.3s;
        }
        .edu-card:hover {
            border-color: rgba(91,141,255,0.4);
            transform: translateY(-4px);
        }

        .edu-card .degree {
